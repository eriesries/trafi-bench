[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — every unknown path falls back to index.html so React
# Router can handle deep links and full-page reloads.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term cache for hashed asset bundles (filenames change every build).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache the entry HTML so users always boot the latest version.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
